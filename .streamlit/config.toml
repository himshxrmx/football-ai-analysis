[client]
# Hide the developer toolbar and deploy button.
toolbarMode = "minimal"
showSidebarNavigation = true

[server]
maxUploadSize = 500
headless = true
runOnSave = false

[browser]
# Do not send usage statistics to Streamlit.
gatherUsageStats = false

[theme]
base = "light"
primaryColor = "#1f6f43"
backgroundColor = "#f7f8f5"
secondaryBackgroundColor = "#eceee8"
textColor = "#1b1f1c"
linkColor = "#1f6f43"
borderColor = "#d5d9cf"
font = "system-ui, -apple-system, Segoe UI, sans-serif"
baseRadius = "4px"
buttonRadius = "4px"
showWidgetBorder = true

[theme.sidebar]
backgroundColor = "#16251b"
secondaryBackgroundColor = "#21352a"
textColor = "#e6ebe5"
primaryColor = "#8fd1a6"
borderColor = "#2d4335"
linkColor = "#8fd1a6"
